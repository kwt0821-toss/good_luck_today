<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@400;500;700&family=Poppins:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <title>럭키캣</title>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #f7fcfb; }
      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 8px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #191f28;
      }
      .boot-fallback span { color: #8b95a1; font-size: 14px; }
    </style>
    <script>
      if (!window.__appsInTossConstants) {
        window.__appsInTossConstants = {
          safeAreaInsets: { top: 0, right: 0, bottom: 0, left: 0 },
        };
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <strong>럭키캣</strong>
        <span>화면을 불러오는 중이에요.</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
