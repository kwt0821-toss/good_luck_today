<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;font-family:'Pretendard','Noto Sans CJK KR',sans-serif;position:relative;background:url(room-bg.png) 0 0/390px 844px;color:#2A2238}
.dim{position:absolute;inset:0;background:rgba(12,9,24,.55)}
.sh{position:absolute;left:0;right:0;bottom:0;background:#FFF6E6;border-radius:28px 28px 0 0;padding:10px 20px 26px}
.grab{width:40px;height:5px;border-radius:3px;background:#D9CCB6;margin:0 auto 10px}
.hero{background:#1E1A2B;border-radius:22px;padding:18px 18px 16px;color:#FFF6E6;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;right:18px;top:14px;width:46px;height:46px;border-radius:50%;box-shadow:-10px 6px 0 0 #FFE7A8;transform:rotate(-20deg);opacity:.9}
.hero i{position:absolute;width:2px;height:2px;background:#FFF6E6;border-radius:50%;opacity:.6}
.k{font-size:11px;letter-spacing:3px;font-weight:800;color:#BFB4D0}
.lv{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1.05;margin-top:2px}.lv small{font-size:18px;font-weight:800;color:#BFB4D0;margin-right:4px}
.bar{height:10px;border-radius:6px;background:#3A3150;margin:14px 0 8px;overflow:hidden}.bar b{display:block;height:100%;width:76%;border-radius:6px;background:linear-gradient(90deg,#8FE3C3,#FFE7A8)}
.row{display:flex;justify-content:space-between;font-size:12.5px;color:#BFB4D0}.row b{color:#FFE7A8;font-weight:900}
.h{font-size:12px;font-weight:800;color:#9A8FA6;margin:16px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.t{background:#fff;border-radius:14px;padding:9px 2px 8px;text-align:center;box-shadow:0 1px 0 #EADFCB}
.t .n{font-size:11px;color:#6E6478;font-weight:700}.t .p{font-size:17px;font-weight:900;margin-top:2px}.t .d{font-size:10.5px;color:#1F7158;font-weight:800;margin-top:1px}
.t.lg{background:#2A2238;color:#FFF6E6}.t.lg .n{color:#BFB4D0}.t.lg .d{color:#8FE3C3}
.notes{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.nt{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:#4A4058}
.nt span{flex:none;width:22px;height:22px;border-radius:8px;background:#F3E9D7;display:flex;align-items:center;justify-content:center;font-size:12px}
.btn{margin-top:16px;height:52px;border-radius:16px;background:#1E1A2B;color:#FFF6E6;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:900}
.btn img{width:20px}
.x{position:absolute;right:20px;top:20px;width:30px;height:30px;border-radius:50%;background:#F3E9D7;display:none}
</style></head><body><div class="dim"></div>
<div class="sh"><div class="grab"></div>
<div class="hero"><i style="left:140px;top:20px"></i><i style="left:230px;top:44px"></i><i style="left:300px;top:80px"></i><i style="left:190px;top:70px"></i>
<div class="k">COZY</div><div class="lv"><small>Lv.</small>4</div>
<div class="bar"><b></b></div><div class="row"><span>182 / 200점</span><span>Lv.5까지 <b>18점 남았어요</b></span></div></div>
<div class="h">아이템마다 코지 점수가 올라요</div>
<div class="grid">
<div class="t"><div class="n">소품</div><div class="p">4</div><div class="d">+2</div></div>
<div class="t"><div class="n">벽 꾸미기</div><div class="p">6</div><div class="d">+3</div></div>
<div class="t"><div class="n">벽지·바닥</div><div class="p">8</div><div class="d">1번</div></div>
<div class="t"><div class="n">가구</div><div class="p">10</div><div class="d">+5</div></div>
<div class="t"><div class="n">큰 가구</div><div class="p">25</div><div class="d">+13</div></div>
</div>
<div class="notes">
<div class="nt"><span>½</span>같은 아이템을 더 사면 절반 점수 (초록 숫자)</div>
<div class="nt"><span>🐾</span>방에 놓지 않아도 가지고 있으면 점수가 올라요</div>
<div class="nt"><span>★</span>레전드급 한정 아이템은 60점 (+30)</div>
</div>
<div class="btn"><img src="icon-paw-coin.svg">아이템 보러가기</div>
</div></body></html>
